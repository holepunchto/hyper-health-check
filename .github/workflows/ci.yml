name: ci
on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: [ubuntu-latest]
    timeout-minutes: 5
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm install
      - run: npm run lint
      - run: npm test
